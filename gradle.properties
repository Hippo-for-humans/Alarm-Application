# Настройки памяти для JVM, на которой работает Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Обязательный флаг: проект использует библиотеки AndroidX (а не устаревший Support Library)
android.useAndroidX=true

# Генерация R-классов только для текущего модуля (ускоряет сборку)
android.nonTransitiveRClass=true

# Официальный стиль кода Kotlin
kotlin.code.style=official
